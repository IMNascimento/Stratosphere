[project]
name = "stratosphere"
version = "0.1.0"
description = "Deteccao de marcas em imagens: separa ONDE ha logo de QUAL logo e"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Igor Nascimento" }]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "numpy (>=1.26,<2.3)",
    "pillow (>=10.0)",
    "transformers (>=4.46)",
    "accelerate (>=0.30)",
    "safetensors (>=0.4)",
    "opencv-contrib-python-headless (>=4.9)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "torch (==2.13.0)",
    "torchvision (==0.28.0)",
    "kornia (>=0.8.3,<0.9.0)",
]

[project.scripts]
stratosphere = "entrypoints.cli.main:main"

# Indice de wheels CUDA do PyTorch. `priority = "explicit"` significa que nada e
# procurado aqui por acaso: so os pacotes que apontarem para esta fonte por nome.
# O resto continua vindo do PyPI.
#
# O canal e o cu130 porque e o unico com torch 2.13.0 para cp311/win_amd64 —
# cu126 e cu128 param no 2.9. Sem esta fonte, o PyPI entrega a build `+cpu` e
# `.to("cuda:0")` levanta "Torch not compiled with CUDA enabled", que nao e um
# problema de driver nem de configuracao: e o pacote errado.
[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[tool.poetry.dependencies]
torch = { version = "2.13.0", source = "pytorch-cu130" }
torchvision = { version = "0.28.0", source = "pytorch-cu130" }

[tool.poetry]
packages = [
    { include = "config" },
    { include = "domain" },
    { include = "application" },
    { include = "infrastructure" },
    { include = "entrypoints" },
    { include = "shared" },
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.6"
mypy = "^1.11"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]
# E501: linha longa — o ruff format ja cuida do limite.
# ANN101/ANN102: exigem anotar `self` e `cls`. Contradizem diretamente
#   .claude/standards/languages/PYTHON.md ("self e cls nunca sao anotados"),
#   e foram descontinuadas no proprio ruff. O padrao do projeto prevalece.
ignore = ["E501", "ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
# ANN401 proibe `Any` em assinatura. Os adaptadores de infrastructure envolvem
# SDKs sem tipagem (tensores, keypoints, handles de modelo) — tipar esses
# objetos exigiria inventar stubs que nao correspondem a realidade da
# biblioteca. `Any` fica confinado a esta camada de proposito: domain e
# application seguem proibindo.
"infrastructure/**/*.py" = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = [
    "domain",
    "application",
    "infrastructure",
    "entrypoints",
    "shared",
    "config",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
# Os adaptadores de infrastructure sao a fronteira com bibliotecas sem tipagem
# completa (transformers, PIL, cv2). Exigir chamada tipada e retorno nao-Any
# nessa fronteira so produziria `cast` decorativo, que esconde o problema em vez
# de resolver. A relaxacao para AQUI: domain e application seguem em strict.
module = ["infrastructure.*"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
